<!-- noindex: den här sidan omdirigerar och har inget eget innehåll värt att
     indexera i Google. Den ska bara nås via länken i den tryckta boken. -->
<meta name="robots" content="noindex">

<!--
  TYPSNITT — Playfair Display (rubrik) och Inter (brödtext), inlästa på exakt
  samma sätt som på resten av sajten (se index.html, huvudet). Länken laddas
  med media="print" och byts till media="all" så snart typsnittet är klart
  (onload) — då väntar inte texten på typsnittet innan sidan visas första
  gången. noscript är en reserv om besökarens webbläsare har JavaScript
  avstängt.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></noscript>

<!-- OMDIRIGERINGEN LIGGER HÄR, INTE I BOKEN. Boken trycker den här adressen;
     när boken är publicerad byts URL:en på raden nedan mot Amazons
     recensionslänk och sidan pushas. Ingen ny inlaga, ingen ny KDP-uppladdning,
     inga tryckta exemplar med en kod som leder fel.
     Ta bort kommenteringen och fyll i länken vid publicering: -->

  h1 { font-family:"Playfair Display",Georgia,serif; color:#1B2733;
       font-weight:700; font-size:clamp(1.6rem,4vw,2.2rem); margin:0 0 .5em; }

<main>
  <h1>Thank you for reading</h1>

  <!-- Länken till kitet (/museum) är borttagen med avsikt, inte glömd. Tre skäl:
       1) Den kostar läsaren ingenting — sid 94 i boken har sin egen QR-kod och
          adress till kitet, så ingen når kitet enbart via den här sidan.
       2) Separationen mellan recensionsönskan och gåvan ska inte vila på att
          en formulering råkar vara försiktig nog. Specen valde hård
          sidseparation just för att slippa den bedömningen — så fort en länk
          och ett övergångsord binder ihop sidorna vilar skyddet på ordval igen.
       3) Risken är asymmetrisk: fel åt ena hållet kan kosta ett stängt
          utgivarkonto hos Amazon; fel åt andra hållet är en länk mindre på en
          sida som ändå blir en omedelbar omdirigering samma dag boken har ett
          ASIN. Kopplingen syns bara under hålltiden (innan meta-refreshen ovan
          är påslagen) — men det är exakt då sid 96:s kod skannas och ingen
          recension finns att lämna än, så den korta livslängden gör inte
          kopplingen ofarlig. Länka inte tillbaka hit utan att läsa punkterna
          ovan igen. -->
  <p><a href="/">Crestiora Books</a></p>
</main>
